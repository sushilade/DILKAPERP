<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Dilkap ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .signup-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
            max-width: 500px;
            width: 100%;
            padding: 50px;
            position: relative;
            z-index: 1;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .signup-header {
            text-align: center;
            margin-bottom: 35px;
        }
        .signup-header .icon {
            font-size: 65px;
            color: #1a73e8;
            margin-bottom: 10px;
        }
        .signup-header h1 {
            color: #1e3c72;
            font-size: 28px;
            font-weight: 700;
        }
        .signup-header p {
            color: #64748b;
            font-size: 14px;
            margin-top: 6px;
        }
        .success-message {
            background: #d1fae5;
            color: #065f44;
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
        }
        .success-message i { margin-right: 8px; }
        .input-group { margin-bottom: 22px; }
        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }
        .input-wrapper { position: relative; }
        .input-wrapper .icon {
            position: absolute;
            left: 14px; top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            color: #94a3b8;
        }
        .input-wrapper input {
            width: 100%;
            padding: 14px 14px 14px 44px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #f8fafc;
        }
        .input-wrapper input:focus {
            outline: none;
            border-color: #1a73e8;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.15);
        }
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #1a73e8 0%, #4285f4 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(26, 115, 232, 0.4);
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: #1a73e8;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
        }
        .back-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="signup-card">
        <div class="signup-header">
            <div class="icon"><i class="bi bi-person-plus-fill"></i></div>
            <h1>Create Your Account</h1>
            <p>Join the Dilkap College portal</p>
        </div>

        <div class="success-message" id="successMsg">
            <i class="bi bi-check-circle-fill"></i> Account created successfully!
        </div>

        <form id="signupForm" autocomplete="off">
            <div class="input-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <i class="bi bi-person-circle"></i>
                    <input type="text" id="username" name="username" placeholder="Enter username" autocomplete="off" required>
                </div>
            </div>
            <div class="input-group">
                <label for="password1">Password</label>
                <div class="input-wrapper">
                    <i class="bi bi-lock-fill"></i>
                    <input type="password" id="password1" name="password1" placeholder="Enter password" autocomplete="off" required>
                </div>
            </div>
            <div class="input-group">
                <label for="password2">Confirm Password</label>
                <div class="input-wrapper">
                    <i class="bi bi-lock-fill"></i>
                    <input type="password" id="password2" name="password2" placeholder="Confirm password" autocomplete="off" required>
                </div>
            </div>
            <button class="btn-submit" type="submit">
                <i class="bi bi-person-check-fill"></i> Create Account
            </button>
        </form>

        <div class="back-link">
            <a href="index.html"><i class="bi bi-arrow-left"></i> Back to Login</a>
        </div>
    </div>

    <script>
        function saveUser(username, password) {
            var users = localStorage.getItem('collegeUsers');
            var usersObj = users ? JSON.parse(users) : {};
            usersObj[username] = password;
            localStorage.setItem('collegeUsers', JSON.stringify(usersObj));
        }

        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var username = document.getElementById('username').value.trim();
            var password1 = document.getElementById('password1').value;
            var password2 = document.getElementById('password2').value;

            if (password1 !== password2) {
                alert('Passwords do not match!');
                return;
            }

            saveUser(username, password1);
            document.getElementById('successMsg').style.display = 'block';
            setTimeout(function() {
                window.location.href = 'index.html';
            }, 1500);
        });
    </script>
</body>
</html>
