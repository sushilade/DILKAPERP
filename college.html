<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Profile - Dilkap ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .logout-link {
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .logout-link:hover { color: #fff; }
        .edit-btn {
            background: linear-gradient(135deg, #43e97b 0%, #188754 100%);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 20px rgba(67, 233, 123, 0.4);
            transition: all 0.3s ease;
            z-index: 10;
        }
        .edit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(67, 233, 123, 0.5);
        }
        .profile-card {
            background: linear-gradient(145deg, #ffffff 0%, #f8f9ff 100%);
            border-radius: 20px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .profile-header {
            background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%);
            padding: 50px 30px 30px;
            text-align: center;
            position: relative;
        }
        .profile-header::before {
            content: "";
            position: absolute;
            top: -50px; left: 50%;
            transform: translateX(-50%);
            width: 120px; height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        .profile-header::after {
            content: "\f19d";
            font-family: "Bootstrap Icons";
            font-size: 55px;
            color: white;
            z-index: 2;
            display: block;
        }
        .profile-header h1 {
            color: white;
            font-size: 28px;
            font-weight: 700;
            margin-top: 60px;
        }
        .profile-header p {
            color: rgba(255, 255, 255, 0.85);
            font-size: 14px;
        }
        .profile-body { padding: 40px; }
        .detail-row {
            display: flex;
            align-items: flex-start;
            padding: 20px 0;
            border-bottom: 1px solid #e3e7ef;
            transition: all 0.3s ease;
        }
        .detail-row:last-child { border-bottom: none; }
        .detail-row:hover {
            background-color: #f0f4ff;
            margin: 0 -40px;
            padding-left: 60px;
            padding-right: 60px;
            border-radius: 8px;
        }
        .detail-icon {
            width: 48px; height: 48px;
            border-radius: 14px;
            background: linear-gradient(135deg, #e8f0fe 0%, #dbe9fe 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 20px;
            flex-shrink: 0;
        }
        .detail-icon i {
            font-size: 22px;
            color: #1a73e8;
        }
        .detail-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #64748b;
            font-weight: 600;
            margin-bottom: 5px;
        }
        .detail-value {
            font-size: 17px;
            color: #1e293b;
            font-weight: 500;
            line-height: 1.5;
        }
        .profile-footer {
            background: #f8f9ff;
            padding: 25px 40px;
            text-align: center;
            border-top: 1px solid #e3e7ef;
        }
        .profile-footer p {
            color: #64748b;
            font-size: 13px;
        }
        @media (max-width: 600px) {
            .profile-body { padding: 25px; }
            .detail-row:hover { margin: 0; padding: 0 20px; }
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .modal {
            background: linear-gradient(145deg, #ffffff 0%, #f8f9ff 100%);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transform: scale(0.9);
            transition: all 0.3s ease;
        }
        .modal.show { transform: scale(1); }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .modal-header h2 {
            color: #1e3c72;
            font-size: 24px;
            font-weight: 700;
        }
        .close-btn {
            background: #f1f5f9;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #94a3b8;
            transition: all 0.2s;
        }
        .close-btn:hover {
            background: #e2e8f0;
            color: #334155;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }
        .form-group .input-wrapper {
            position: relative;
        }
        .form-group .input-wrapper .icon {
            position: absolute;
            left: 14px; top: 50%;
            transform: translateY(-50%);
            font-size: 17px;
            color: #94a3b8;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 14px 14px 14px 44px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #f8fafc;
            font-family: inherit;
        }
        .form-group textarea {
            padding: 14px 14px 14px 44px;
            resize: vertical;
            min-height: 100px;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #1a73e8;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.15);
        }
        .modal-actions {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }
        .btn-save {
            flex: 1;
            background: linear-gradient(135deg, #1a73e8 0%, #4285f4 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(26, 115, 232, 0.4);
        }
        .btn-cancel {
            flex: 1;
            background: #f1f5f9;
            color: #475569;
            border: 2px solid #e2e8f0;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-cancel:hover { background: #e2e8f0; }
        .save-success {
            display: none;
            background: #d1fae5;
            color: #065f44;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 20px;
            align-items: center;
            gap: 8px;
        }
        .save-success.show { display: flex; }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <a href="index.html" class="logout-link"><i class="bi bi-door-closed"></i> Logout</a>
            <button class="edit-btn" onclick="openEditModal()">
                <i class="bi bi-pencil-square"></i> Edit College Details
            </button>
        </div>

        <div class="profile-card">
            <div class="profile-header">
                <h1 id="collegeName">College Profile</h1>
                <p>Verified Institution Profile</p>
            </div>

            <div class="profile-body">
                <div class="detail-row">
                    <div class="detail-icon"><i class="bi bi-buildings-fill"></i></div>
                    <div>
                        <div class="detail-label">College Name</div>
                        <div class="detail-value" id="collegeNameVal">College Name</div>
                    </div>
                </div>
                <div class="detail-row">
                    <div class="detail-icon"><i class="bi bi-geo-alt-fill"></i></div>
                    <div>
                        <div class="detail-label">College Address</div>
                        <div class="detail-value" id="collegeAddrVal">College Address</div>
                    </div>
                </div>
                <div class="detail-row">
                    <div class="detail-icon"><i class="bi bi-telephone-fill"></i></div>
                    <div>
                        <div class="detail-label">Contact Number</div>
                        <div class="detail-value" id="collegeContactVal">Contact Number</div>
                    </div>
                </div>
            </div>

            <div class="profile-footer">
                <p>College Directory &mdash; Connecting Students &amp; Faculty</p>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <div class="modal-header">
                <h2><i class="bi bi-pencil-square"></i> Edit College Information</h2>
                <button class="close-btn" onclick="closeEditModal()">&times;</button>
            </div>

            <div class="save-success" id="saveSuccess">
                <i class="bi bi-check-circle-fill"></i> Changes saved successfully!
            </div>

            <div class="form-group">
                <label for="editCollegeName">College Name</label>
                <div class="input-wrapper">
                    <i class="bi bi-buildings-fill"></i>
                    <input type="text" id="editCollegeName" placeholder="Enter college name" required>
                </div>
            </div>

            <div class="form-group">
                <label for="editCollegeAddress">College Address</label>
                <div class="input-wrapper">
                    <i class="bi bi-geo-alt-fill"></i>
                    <textarea id="editCollegeAddress" placeholder="Enter college address" required></textarea>
                </div>
            </div>

            <div class="form-group">
                <label for="editCollegeContact">Contact Number</label>
                <div class="input-wrapper">
                    <i class="bi bi-telephone-fill"></i>
                    <input type="text" id="editCollegeContact" placeholder="Enter contact number" required>
                </div>
            </div>

            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeEditModal()">
                    Cancel
                </button>
                <button class="btn-save" onclick="saveChanges()">
                    <i class="bi bi-save"></i> Save Changes
                </button>
            </div>
        </div>
    </div>

    <script>
        function loadData() {
            var db = localStorage.getItem('collegeDB');
            var data;
            if (db) {
                data = JSON.parse(db);
            } else {
                data = {
                    college_name: "Dilkap College of Engineering",
                    college_address: "Plot No. 123, Knowledge Park V, Greater Noida, Uttar Pradesh 201306, India",
                    college_contact_number: "+91-120-1234-5678"
                };
                localStorage.setItem('collegeDB', JSON.stringify(data));
            }
            updateDisplay(data);
            return data;
        }

        function updateDisplay(data) {
            document.getElementById('collegeName').textContent = data.college_name;
            document.getElementById('collegeNameVal').textContent = data.college_name;
            document.getElementById('collegeAddrVal').textContent = data.college_address;
            document.getElementById('collegeContactVal').textContent = data.college_contact_number;
        }

        function openEditModal() {
            var data = loadData();
            document.getElementById('editCollegeName').value = data.college_name;
            document.getElementById('editCollegeAddress').value = data.college_address;
            document.getElementById('editCollegeContact').value = data.college_contact_number;
            document.getElementById('editModal').style.display = 'flex';
            setTimeout(function() {
                document.querySelector('.modal').classList.add('show');
            }, 10);
            document.getElementById('saveSuccess').classList.remove('show');
        }

        function closeEditModal() {
            document.querySelector('.modal').classList.remove('show');
            setTimeout(function() {
                document.getElementById('editModal').style.display = 'none';
            }, 300);
        }

        function saveChanges() {
            var name = document.getElementById('editCollegeName').value.trim();
            var address = document.getElementById('editCollegeAddress').value.trim();
            var contact = document.getElementById('editCollegeContact').value.trim();

            if (!name || !address || !contact) {
                return;
            }

            var data = {
                college_name: name,
                college_address: address,
                college_contact_number: contact
            };

            localStorage.setItem('collegeDB', JSON.stringify(data));
            updateDisplay(data);

            document.getElementById('saveSuccess').classList.add('show');
            setTimeout(function() {
                closeEditModal();
            }, 1500);
        }

        loadData();
    </script>
</body>
</html>
