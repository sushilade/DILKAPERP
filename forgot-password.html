<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Dilkap ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .reset-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
            max-width: 500px;
            width: 100%;
            padding: 50px;
            position: relative;
            z-index: 1;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .reset-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .reset-header .icon {
            font-size: 65px;
            color: #1a73e8;
            margin-bottom: 10px;
        }
        .reset-header h1 {
            color: #1e3c72;
            font-size: 26px;
            font-weight: 700;
        }
        .reset-header p {
            color: #64748b;
            font-size: 14px;
            margin-top: 6px;
            line-height: 1.6;
        }
        .input-group { margin-bottom: 22px; }
        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }
        .input-wrapper { position: relative; }
        .input-wrapper .icon {
            position: absolute;
            left: 14px; top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            color: #94a3b8;
        }
        .input-wrapper input {
            width: 100%;
            padding: 14px 14px 14px 44px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #f8fafc;
        }
        .input-wrapper input:focus {
            outline: none;
            border-color: #1a73e8;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.15);
        }
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #1a73e8 0%, #4285f4 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(26, 115, 232, 0.4);
        }
        .info-box {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 10px;
            padding: 14px;
            margin-top: 20px;
            text-align: center;
            font-size: 13px;
            color: #1e40af;
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: #1a73e8;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
        }
        .back-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="reset-card">
        <div class="reset-header">
            <div class="icon"><i class="bi bi-key-fill"></i></div>
            <h1>Forgot Password?</h1>
            <p>Enter your username to reset your password.</p>
        </div>
        <form id="resetForm" autocomplete="off">
            <div class="input-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <i class="bi bi-person-circle"></i>
                    <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="off" required>
                </div>
            </div>
            <button class="btn-submit" type="submit">
                <i class="bi bi-arrow-right-circle"></i> Reset Password
            </button>
        </form>
        <div class="info-box">
            <i class="bi bi-info-circle-fill"></i> Your new password will be regenerated and displayed below.
        </div>
        <div class="back-link">
            <a href="index.html"><i class="bi bi-arrow-left"></i> Back to Login</a>
        </div>
    </div>

    <script>
        document.getElementById('resetForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var username = document.getElementById('username').value.trim();
            var users = localStorage.getItem('collegeUsers');
            var usersObj = users ? JSON.parse(users) : {};

            if (usersObj.hasOwnProperty(username)) {
                var newPass = Math.random().toString(36).slice(-8) + "Aa1!";
                usersObj[username] = newPass;
                localStorage.setItem('collegeUsers', JSON.stringify(usersObj));
                alert('Password reset successful!\nNew password: ' + newPass + '\n\nPlease log in with your new password.');
            } else if (username === 'admin') {
                var newPass = Math.random().toString(36).slice(-8) + "Aa1!";
                alert('Password reset successful!\nNew password: ' + newPass + '\n\nPlease log in with your new password.');
            } else {
                alert('Username not found!');
            }
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
