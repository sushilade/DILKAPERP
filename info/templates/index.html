<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dilkap ERP - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .login-illustration {
            flex: 1;
            background: linear-gradient(145deg, #0f3460 0%, #1a73e8 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            color: white;
            text-align: center;
        }
        .login-illustration .college-icon { font-size: 90px; margin-bottom: 20px; }
        .login-illustration h2 { font-size: 28px; font-weight: 700; margin-bottom: 10px; }
        .login-illustration p { font-size: 15px; opacity: 0.85; }
        .login-form { flex: 1; padding: 50px; background: rgba(255, 255, 255, 0.95); }
        .login-form h1 { color: #1e3c72; font-size: 30px; font-weight: 700; margin-bottom: 8px; }
        .login-form p { color: #64748b; font-size: 14px; margin-bottom: 30px; }
        .input-group { margin-bottom: 22px; }
        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }
        .input-wrapper { position: relative; }
        .input-wrapper .icon {
            position: absolute;
            left: 14px; top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            color: #94a3b8;
        }
        .input-wrapper input {
            width: 100%;
            padding: 14px 14px 14px 44px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            background: #f8fafc;
        }
        .input-wrapper input:focus {
            outline: none;
            border-color: #1a73e8;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.15);
        }
        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }
        .error-message i { margin-right: 8px; font-size: 16px; }
        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, #1a73e8 0%, #4285f4 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(26, 115, 232, 0.4); }
        .options { display: flex; justify-content: space-between; margin-top: 20px; font-size: 14px; }
        .options a { color: #1a73e8; text-decoration: none; font-weight: 500; transition: color 0.2s; }
        .options a:hover { text-decoration: underline; }
        .btn-signup {
            margin-top: 15px;
            width: 100%;
            background: #f1f5f9;
            color: #334155;
            border: 2px solid #e2e8f0;
            padding: 12px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-signup:hover { background: #e2e8f0; }
        .divider { text-align: center; margin: 25px 0; position: relative; color: #94a3b8; font-size: 13px; }
        .divider::before { content: ""; position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: #cbd5e1; }
        .divider span { background: rgba(255, 255, 255, 0.95); padding: 0 12px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-illustration">
            <div class="college-icon"><i class="bi bi-mortarboard-fill"></i></div>
            <h2>Welcome Back</h2>
            <p>Dilkap College of Engineering<br>Student &amp; Faculty Portal</p>
        </div>
        <div class="login-form">
            <h1>Welcome Back!</h1>
            <p>Enter your credentials to continue</p>
            {% if error %}
            <div class="error-message">
                <i class="bi bi-exclamation-circle-fill"></i>
                {{ error }}
            </div>
            {% endif %}
            <form method="POST" action="{% url 'login' %}">
                {% csrf_token %}
                <div class="input-group">
                    <label for="id_username">User ID</label>
                    <div class="input-wrapper">
                        <i class="bi bi-person-circle"></i>
                        <input type="text" id="id_username" name="username" placeholder="Enter your user ID" autocomplete="username" required>
                    </div>
                </div>
                <div class="input-group">
                    <label for="id_password">Password</label>
                    <div class="input-wrapper">
                        <i class="bi bi-lock-fill"></i>
                        <input type="password" id="id_password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                    </div>
                </div>
                <button class="btn-login" type="submit"><i class="bi bi-box-arrow-in-right"></i> Login</button>
            </form>
            <div class="options">
                <a href="{% url 'password_reset' %}"><i class="bi bi-question-circle"></i> Forgot Password?</a>
                <a href="{% url 'signup' %}">Create Account</a>
            </div>
            <div class="divider"><span>OR</span></div>
            <button class="btn-signup" onclick="location.href='{% url 'signup' %}'"><i class="bi bi-person-plus"></i> Sign Up</button>
        </div>
    </div>
</body>
</html>
