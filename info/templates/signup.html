<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Dilkap ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .signup-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
            max-width: 500px;
            width: 100%;
            padding: 50px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .signup-header { text-align: center; margin-bottom: 35px; }
        .signup-header .icon { font-size: 65px; color: #1a73e8; margin-bottom: 10px; }
        .signup-header h1 { color: #1e3c72; font-size: 28px; font-weight: 700; }
        .signup-header p { color: #64748b; font-size: 14px; margin-top: 6px; }
        .errorlist { color: #dc2626; font-size: 13px; margin: -10px 0 10px 0; }
        .input-group { margin-bottom: 22px; }
        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }
        .input-wrapper { position: relative; }
        .input-wrapper .icon {
            position: absolute;
            left: 14px; top: 50%;
            transform: translateY(-50%);
            font-size: 17px;
            color: #94a3b8;
        }
        .input-wrapper input {
            width: 100%;
            padding: 14px 14px 14px 44px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            background: #f8fafc;
            font-family: inherit;
        }
        .input-wrapper input:focus {
            outline: none;
            border-color: #1a73e8;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.15);
        }
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #1a73e8 0%, #4285f4 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(26, 115, 232, 0.4); }
        .back-link { text-align: center; margin-top: 20px; }
        .back-link a { color: #1a73e8; text-decoration: none; font-weight: 500; font-size: 14px; }
        .back-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="signup-card">
        <div class="signup-header">
            <div class="icon"><i class="bi bi-person-plus-fill"></i></div>
            <h1>Create Your Account</h1>
            <p>Join the Dilkap College portal</p>
        </div>
        <form method="POST" action="{% url 'signup' %}">
            {% csrf_token %}
            {{ form.non_field_errors }}
            <div class="input-group">
                <label for="id_username">Username</label>
                <div class="input-wrapper">
                    <i class="bi bi-person-circle"></i>
                    {{ form.username }}
                </div>
                {{ form.username.errors }}
            </div>
            <div class="input-group">
                <label for="id_password1">Password</label>
                <div class="input-wrapper">
                    <i class="bi bi-lock-fill"></i>
                    {{ form.password1 }}
                </div>
                {{ form.password1.errors }}
            </div>
            <div class="input-group">
                <label for="id_password2">Confirm Password</label>
                <div class="input-wrapper">
                    <i class="bi bi-lock-fill"></i>
                    {{ form.password2 }}
                </div>
                {{ form.password2.errors }}
            </div>
            <button class="btn-submit" type="submit">
                <i class="bi bi-person-check-fill"></i> Create Account
            </button>
        </form>
        <div class="back-link">
            <a href="{% url 'login' %}"><i class="bi bi-arrow-left"></i> Back to Login</a>
        </div>
    </div>
</body>
</html>
